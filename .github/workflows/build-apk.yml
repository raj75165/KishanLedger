name: Build Android APK

on:
  # Run manually from the Actions tab
  workflow_dispatch:
  # Also run automatically on every push to main
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Run Expo prebuild (generate Android project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          # Prevent interactive prompts
          CI: 1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KishanLedger-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # Keep the APK available for 30 days
          retention-days: 30
