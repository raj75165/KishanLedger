name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload APK to latest release'
        required: false
        default: 'false'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install

      - name: Setup EAS
        run: |
          bun install -g @expo/eas-cli
          eas --version

      - name: Build Android APK
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build to complete
        run: |
          echo "Build started. Check your EAS dashboard for build status."
          echo "Once the build is complete, download the APK from your EAS dashboard."
          echo "To automatically upload to releases, you'll need to configure this workflow further."

      - name: Create build info
        run: |
          echo "## Android APK Build" >> build-info.md
          echo "" >> build-info.md
          echo "Build triggered via GitHub Actions" >> build-info.md
          echo "Platform: Android" >> build-info.md
          echo "Profile: preview" >> build-info.md
          echo "" >> build-info.md
          echo "To download your APK:" >> build-info.md
          echo "1. Visit https://expo.dev/" >> build-info.md
          echo "2. Navigate to your project" >> build-info.md
          echo "3. Go to the Builds section" >> build-info.md
          echo "4. Download the latest Android build" >> build-info.md

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.md
