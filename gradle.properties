# ---------------------------------------------------------------------------
# WINDOWS BUILD: Fix for "Filename longer than 260 characters" CMake error
#
# React Native New Architecture compiles native C++ modules via CMake/ninja.
# On Windows, the default build output path can exceed the MAX_PATH limit
# (260 characters). This property (supported by Android Gradle Plugin 8.3+)
# moves the C++ build staging directory to a shorter path, reducing the
# total length of intermediate file paths.
#
# If you still see this error after applying this setting, you must also
# take ONE of the following actions:
#
# Option 1 (Recommended) - Enable Windows Long Path support
#   Run in PowerShell as Administrator, then restart your PC:
#   New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
#     -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
#
# Option 2 - Move the project to a shorter directory path
#   e.g. C:\dev\project instead of a deep Documents sub-folder
# ---------------------------------------------------------------------------
android.cxxBuildDir=cxx
